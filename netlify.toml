# Static Next.js export → publish the `out/` folder.
# Do NOT set Publish directory to `public` (no index.html there → 404).
#
# In Netlify UI → Site configuration → Build & deploy:
#   - Build command: npm run build  (or leave blank; this file wins)
#   - Publish directory: out
# Then: Deploys → Trigger deploy → Clear cache and deploy site
#
# Gemini printable chat (/tools/chat):
#   Set GEMINI_API_KEY in Netlify → Environment variables (secret).
#   Optional: GEMINI_MODEL (default gemini-2.0-flash-lite), GEMINI_DAILY_MAX (default 500).
#   Function: netlify/functions/generate-worksheet.js → /.netlify/functions/generate-worksheet
#   Local: netlify dev (not plain next dev) so the function is available.

[build]
  command = "npm run build"
  publish = "out"

[functions]
  directory = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"
  NEXT_TELEMETRY_DISABLED = "1"
  NEXT_PUBLIC_GA_ID = "G-N7P5CLP7BW"
  NEXT_PUBLIC_INSTAGRAM_URL = "https://www.instagram.com/homeworkbuddyapp"
  # Meta Pixel ID from Events Manager → set in Netlify UI if you prefer not to commit it:
  # NEXT_PUBLIC_META_PIXEL_ID = "YOUR_PIXEL_ID"
  # Cap parallelism if Netlify memory is tight on larger rebuilds
  NODE_OPTIONS = "--max-old-space-size=4096"

# Canonical host is apex HTTPS (matches site.url / metadataBase).
# One hop only: avoid http://www → https://www → https://apex chains.
# GSC "Page with redirect" on these 3 hosts is expected — do not validate as a "fix".
[[redirects]]
  from = "http://www.easyhomeworkactivity.com/*"
  to = "https://easyhomeworkactivity.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.easyhomeworkactivity.com/*"
  to = "https://easyhomeworkactivity.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://easyhomeworkactivity.com/*"
  to = "https://easyhomeworkactivity.com/:splat"
  status = 301
  force = true

# Old beta signup URL → Get the app + iPhone waitlist
[[redirects]]
  from = "/beta"
  to = "/download"
  status = 301
  force = true

# Next's generated Open Graph image has no filename extension in a static
# export, so Netlify otherwise serves it as text/plain.
[[headers]]
  for = "/opengraph-image"
  [headers.values]
    Content-Type = "image/png"
