# Static Next.js export → publish the `out/` folder.
# Do NOT set Publish directory to `public` (no index.html there → 404).
#
# In Netlify UI → Site configuration → Build & deploy:
#   - Build command: npm run build  (or leave blank; this file wins)
#   - Publish directory: out
# Then: Deploys → Trigger deploy → Clear cache and deploy site

[build]
  command = "npm run build"
  publish = "out"

[build.environment]
  NODE_VERSION = "22"
  NEXT_TELEMETRY_DISABLED = "1"
  NEXT_PUBLIC_GA_ID = "G-N7P5CLP7BW"
  NEXT_PUBLIC_INSTAGRAM_URL = "https://www.instagram.com/homeworkbuddyapp"
  # Cap parallelism if Netlify memory is tight on larger rebuilds
  NODE_OPTIONS = "--max-old-space-size=4096"

# Canonical host is apex (matches site.url / metadataBase). Consolidate www signals.
[[redirects]]
  from = "https://www.easyhomeworkactivity.com/*"
  to = "https://easyhomeworkactivity.com/:splat"
  status = 301
  force = true

# Old beta signup URL → Get the app + iPhone waitlist
[[redirects]]
  from = "/beta"
  to = "/download"
  status = 301
  force = true
